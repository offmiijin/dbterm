[package]
name = "dbterm"
version = "0.1.0"
edition = "2024"
description = "Gerenciador de banco de dados via terminal"
license = "MIT"

[dependencies]
# o default do ratatui ja traz all-widgets + layout-cache; o backend crossterm
# (0.29) vem junto e e reexportado em `ratatui::crossterm`, entao nao ha
# dependencia direta de crossterm para casar versao.
ratatui = "0.30"
# minimal-rust: flate2 com backend Rust puro, sem openssl/native-tls.
mysql = { version = "28", default-features = false, features = ["minimal-rust"] }
# Histórico das conexões rápidas em JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Senha salva cifrada em repouso (AES-256-GCM com chave local).
aes-gcm = "0.10"
# Chave da cifra no cofre do SO (Keychain/Credential Manager/Secret Service).
keyring = "4"
base64 = "0.22"
zeroize = "1"
